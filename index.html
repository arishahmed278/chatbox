<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBox | Welcome</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 15px;
      font-family: "Segoe UI", sans-serif;
      color: #f4faf7;
      background:
        radial-gradient(ellipse at 10% 10%, #204b40 0%, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #153c35 0%, transparent 38%),
        linear-gradient(135deg, #0d2926, #143a33 55%, #0b2925);
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
      opacity: .17;
      animation: float 8s ease-in-out infinite;
    }

    .orb-one {
      width: 190px;
      height: 190px;
      background: #579b7d;
      top: 8%;
      left: 8%;
    }

    .orb-two {
      width: 130px;
      height: 130px;
      background: #387c66;
      bottom: 8%;
      right: 8%;
      animation-delay: -3s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-22px);
      }
    }

    .auth-card {
      position: relative;
      z-index: 1;
      width: 365px;
      max-width: calc(100vw - 30px);
      min-height: 555px;
      padding: 36px 30px;
      border-radius: 27px;
      background: rgba(11, 31, 29, 0.96);
      border: 1px solid rgba(139, 190, 164, 0.15);
      box-shadow: 0 25px 80px rgba(2, 15, 13, 0.55);
      backdrop-filter: blur(18px);
      animation: appear .7s ease;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .auth-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 85px rgba(2, 15, 13, 0.65);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 21px;
      background: linear-gradient(145deg, #6fbd96, #348565);
      color: #0c3026;
      font-size: 30px;
      box-shadow: 0 9px 30px rgba(75, 175, 125, .14);
    }

    .brand h1 {
      font-size: 29px;
      font-weight: 750;
      letter-spacing: .5px;
      color: #f0fff8;
      margin-bottom: 5px;
    }

    .brand p {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #88aa99;
    }

    .form-title {
      font-size: 24px;
      font-weight: 700;
      color: #f4fff9;
      margin-bottom: 6px;
    }

    .form-description {
      font-size: 13px;
      color: #8da99c;
      margin-bottom: 25px;
    }

    .form-label {
      color: #c6dbce;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-group {
      margin-bottom: 19px;
    }

    .input-group-text {
      width: 45px;
      justify-content: center;
      color: #91c9aa;
      background: #173832;
      border: 1px solid #2b5145;
      border-right: none;
      border-radius: 11px 0 0 11px;
    }

    .form-control {
      min-height: 47px;
      color: #f4fff9;
      background: #173832;
      border: 1px solid #2b5145;
      border-left: none;
      border-radius: 0 11px 11px 0;
      font-size: 13px;
      transition: .25s ease;
    }

    .form-control::placeholder {
      color: #88a99a;
    }

    .form-control:focus {
      color: white;
      background: #1d453b;
      border-color: #69b991;
      box-shadow: 0 0 0 3px rgba(105, 185, 145, .12);
    }

    .auth-btn {
      width: 100%;
      min-height: 49px;
      margin-top: 7px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(110deg, #79c69f, #4caa7e);
      color: #0d3026;
      font-size: 15px;
      font-weight: 750;
      transition: all .3s ease;
      box-shadow: 0 7px 20px rgba(80, 175, 125, .12);
    }

    .auth-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(110deg, #91d9b3, #65bd91);
      box-shadow: 0 11px 25px rgba(80, 175, 125, .22);
    }

    .auth-btn:active {
      transform: scale(.98);
    }

    .auth-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .switch-text {
      text-align: center;
      font-size: 13px;
      color: #8da99c;
      margin-top: 25px;
    }

    .switch-link {
      color: #8bd2aa;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .switch-link:hover {
      color: #c4f5d8;
      text-decoration: underline;
    }

    /* Firebase messages */
    .auth-message {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 17px;
    }

    .auth-message.success {
      display: block;
      color: #bdf5d9;
      background: rgba(60, 180, 125, .12);
      border: 1px solid #397c5d;
    }

    .auth-message.error {
      display: block;
      color: #ffd1d1;
      background: rgba(200, 75, 75, .12);
      border: 1px solid #945252;
    }

    .auth-panel {
      animation: panelIn .35s ease;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(9px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none !important;
    }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #6f9282;
      margin-top: 30px;
    }

    @media (max-width: 400px) {
      .auth-card {
        padding: 30px 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <main class="auth-card">

    <header class="brand">
      <div class="brand-icon">
        <i class="bi bi-chat-heart-fill"></i>
      </div>
      <h1>ChatBox</h1>
      <p>Your space to connect</p>
    </header>

    <!-- Message -->
    <div id="authMessage" class="auth-message"></div>

    <!-- LOGIN PANEL -->
    <section id="loginPanel" class="auth-panel">

      <h2 class="form-title">Welcome Back</h2>
      <p class="form-description">
        Sign in to continue your conversations.
      </p>

      <form id="loginForm">

        <label class="form-label" for="loginEmail">
          Email Address
        </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>

          <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
        </div>

        <label class="form-label" for="loginPassword">
          Password
        </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>

          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="auth-btn" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-2"></i>
          Sign In
        </button>

      </form>

      <p class="switch-text">
        New to ChatBox?
        <a class="switch-link" id="showSignup">Create Account</a>
      </p>

    </section>
    <section id="signupPanel" class="auth-panel hidden">

      <h2 class="form-title">Create Account</h2>
      <p class="form-description">
        Join us and start connecting.
      </p>

      <form id="signupForm">

        <label class="form-label" for="signupName">
          Full Name
        </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person"></i>
          </span>

          <input type="text" class="form-control" id="signupName" placeholder="Your full name" required>
        </div>

        <label class="form-label" for="signupEmail">
          Email Address
        </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>

          <input type="email" class="form-control" id="signupEmail" placeholder="name@example.com" required>
        </div>

        <label class="form-label" for="signupPassword">
          Password
        </label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>

          <input type="password" class="form-control" id="signupPassword" placeholder="At least 6 characters"
            minlength="6" required>
        </div>

        <button type="submit" class="auth-btn" id="signupBtn">
          <i class="bi bi-person-plus me-2"></i>
          Create Account
        </button>

      </form>

      <p class="switch-text">
        Already have an account?
        <a class="switch-link" id="showLogin">Sign In</a>
      </p>

    </section>

    <footer class="footer-text">
      © 2026 ChatBox · Made for conversations
    </footer>

  </main>
  <script type="module" src="js/auth.js"></script>

</body>

</html>
